[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-provenance-fixtures"
version = "1.0.0"
description = "Versioned content-provenance test fixtures: transformation chains (metadata stripped, re-encoded, resized, excerpted) with hash-chained records, expected verified/unknown/lost verdicts per assertion, and a reference checker."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["provenance_fixtures"]
